<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>依 Excel：XY 導航</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#0d1117;color:#e6edf3}
.wrap{max-width:900px;margin:auto;padding:14px}
.card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:14px;margin:10px 0}
h2{margin:4px 0 10px;font-size:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label{font-size:13px;color:#9da7b3} input{width:100%;box-sizing:border-box;margin-top:5px;padding:10px;border-radius:9px;border:1px solid #444;background:#0d1117;color:white;font-size:16px}
button{padding:11px 14px;border:0;border-radius:10px;margin:4px;font-size:15px}
.primary{background:#238636;color:white}.stop{background:#da3633;color:white}.secondary{background:#30363d;color:white}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0d1117;border-radius:10px;padding:10px;text-align:center}.big{font-size:22px;font-weight:700}
canvas{width:100%;height:430px;background:white;border-radius:10px;display:block}
.note{font-size:12px;color:#9da7b3;line-height:1.5}
@media(max-width:600px){.grid,.stats{grid-template-columns:1fr}.wrap{padding:8px}canvas{height:380px}}
</style>
</head>
<body><div class="wrap">
<div class="card">
<h2>依 Excel：XY 導航</h2>
<div class="grid">
<div><label>判斷數（BH2）<input id="judge" type="number" step="0.01" value="0.7"></label></div>
<div><label>限制步數（BI2）<input id="limitSteps" type="number" step="1" value="4"></label></div>
<div><label>判定一步（BJ2）<input id="stepThreshold" type="number" step="0.01" value="0.08"></label></div>
</div>
<div style="margin-top:10px">
<button class="primary" id="start">開始量測</button><button class="stop" id="stop">停止</button>
<button class="secondary" id="reset">重設</button><button class="secondary" id="csv">匯出 CSV</button>
</div>
<p class="note">Excel 邏輯：前 49 筆加速度建立初始 Z；三軸依 X→Y→Z 更新；Z 加速度四層 13 點置中平均；一步條件為 4 升、4 降且峰值差大於「判定一步」。Z 軸航向角只在 Excel 的 OR 條件成立時積分：XY 角度變化量小於「判斷數」，或指定區間步數變化大於「限制步數」。</p>
</div>
<div class="card stats">
<div class="stat"><div>步數</div><div class="big" id="steps">0</div></div>
<div class="stat"><div>X</div><div class="big" id="xv">0.00</div></div>
<div class="stat"><div>Y</div><div class="big" id="yv">0.00</div></div>
</div>
<div class="card"><h2>最後 XY 軌跡</h2><canvas id="plot" width="850" height="430"></canvas></div>
</div>
<script>
const $=id=>document.getElementById(id);
let running=false, raw=[], rows=[], path=[{x:0,y:0}], lastT=null;
let z0=null,y0=null,x0=null, basis=null, heading=0, posX=0,posY=0, stepCount=0;
let filt1=[],filt2=[],filt3=[],filt4=[], pendingAX=[];
const accelSign=-1; // 依先前 iPhone/phyphox 實機比對
function norm(v){let n=Math.hypot(...v)||1;return v.map(x=>x/n)}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function rot(v,dx,dy,dz){
 let [x,y,z]=v;
 let K=x,L=y*Math.cos(dx)+z*Math.sin(dx),M=-y*Math.sin(dx)+z*Math.cos(dx);
 let N=-M*Math.sin(dy)+K*Math.cos(dy),O=L,P=M*Math.cos(dy)+K*Math.sin(dy);
 return [N*Math.cos(dz)+O*Math.sin(dz),-N*Math.sin(dz)+O*Math.cos(dz),P];
}
function avg(a,i,r=6){
 let s=0,n=0; for(let k=Math.max(0,i-r);k<=Math.min(a.length-1,i+r);k++){if(Number.isFinite(a[k])){s+=a[k];n++}}
 return n?s/n:NaN;
}
function recomputeCentered(){
 // Excel stable region: 4 cascaded centered 13-point averages.
 const at=rows.map(r=>r.at);
 filt1=at.map((_,i)=>avg(at,i));
 filt2=filt1.map((_,i)=>avg(filt1,i));
 filt3=filt2.map((_,i)=>avg(filt2,i));
 filt4=filt3.map((_,i)=>avg(filt3,i));
}
function rebuildNavigation(){
 if(rows.length<30)return;
 recomputeCentered();
 heading=0;posX=0;posY=0;stepCount=0;path=[{x:0,y:0}];
 let BA=new Array(rows.length).fill(0), BC=new Array(rows.length).fill(0);
 let AR=rows.map(r=>r.ar), AS=rows.map(r=>r.as);
 const judge=+$('judge').value, lim=+$('limitSteps').value, th=+$('stepThreshold').value;
 for(let i=4;i<rows.length-4;i++){
   let ax=filt4;
   let step=(ax[i-4]<ax[i-3]&&ax[i-3]<ax[i-2]&&ax[i-2]<ax[i-1]&&ax[i-1]<ax[i]&&
             ax[i]>ax[i+1]&&ax[i+1]>ax[i+2]&&ax[i+2]>ax[i+3]&&ax[i+3]>ax[i+4]&&ax[i]-ax[i+4]>th)?1:0;
   if(step)stepCount++;
   BA[i]=step?stepCount:0; // 對應 Excel BA：非步點為 0
   let a0=Math.max(0,i-25),a1=Math.min(rows.length-1,i+25);
   let arw=AR.slice(a0,a1+1),asw=AS.slice(a0,a1+1);
   let xyRange=(Math.max(...arw)+Math.max(...asw)-Math.min(...arw)-Math.min(...asw));
   let b0=Math.max(0,i-97),b1=Math.min(rows.length-1,i+97), bw=BA.slice(b0,b1+1);
   let stepRange=Math.max(...bw)-Math.min(...bw);
   let dt=i?rows[i].t-rows[i-1].t:0;
   BC[i]=(xyRange<judge || stepRange>lim) ? (BC[i-1]+rows[i].bb*dt) : BC[i-1];
   if(step){
     posX += -Math.sin(BC[i]);
     posY +=  Math.cos(BC[i]);
     path.push({x:posX,y:posY});
   }
 }
 heading=BC[Math.max(0,rows.length-5)]||0;
 $('steps').textContent=stepCount;$('xv').textContent=posX.toFixed(2);$('yv').textContent=posY.toFixed(2);
 draw();
}
function initBasis(){
 let n=raw.length; if(n<49)return false;
 let a=[0,0,0]; for(let i=0;i<49;i++){a[0]+=raw[i].a[0];a[1]+=raw[i].a[1];a[2]+=raw[i].a[2]}
 z0=norm(a);
 // Excel 起始 y： (0, z/sqrt(z²+y²), -y/sqrt(z²+y²))
 let d=Math.hypot(z0[2],z0[1])||1; y0=[0,z0[2]/d,-z0[1]/d];
 x0=cross(y0,z0); basis={x:x0,y:y0,z:z0}; return true;
}
function onMotion(e){
 if(!running)return;
 let a=e.accelerationIncludingGravity, g=e.rotationRate;if(!a||!g)return;
 let now=performance.now()/1000, dt=lastT==null?0.01:Math.min(.1,Math.max(.001,now-lastT));lastT=now;
 let av=[accelSign*(a.x||0),accelSign*(a.y||0),accelSign*(a.z||0)];
 let w=[(g.alpha||0)*Math.PI/180,(g.beta||0)*Math.PI/180,(g.gamma||0)*Math.PI/180];
 raw.push({t:now,a:av,w});
 if(!basis){if(!initBasis())return;}
 let dx=w[0]*dt,dy=w[1]*dt,dz=w[2]*dt;
 basis.x=norm(rot(basis.x,dx,dy,dz));basis.y=norm(rot(basis.y,dx,dy,dz));basis.z=norm(rot(basis.z,dx,dy,dz));
 // Excel AO/AP/AQ transformed angular velocities
 let ao=dot(basis.x,w), ap=dot(basis.y,w), aq=dot(basis.z,w);
 let prev=rows[rows.length-1], ar=(prev?prev.ar:0)+ao*dt, as=(prev?prev.as:0)+ap*dt;
 // Excel AT has one-row acceleration shift; live version uses current sample with current basis.
 let at=dot(av,basis.z), bb=aq;
 rows.push({t:now-raw[0].t,ao,ap,aq,ar,as,at,bb});
 if(rows.length%5===0)rebuildNavigation();
}
function draw(){
 let c=$('plot'),ctx=c.getContext('2d'),W=c.width,H=c.height;ctx.clearRect(0,0,W,H);ctx.fillStyle='white';ctx.fillRect(0,0,W,H);
 let pts=path.length?path:[{x:0,y:0}], xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
 let minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
 let span=Math.max(maxx-minx,maxy-miny,2),pad=35,scale=Math.min((W-2*pad)/span,(H-2*pad)/span);
 let cx=(minx+maxx)/2,cy=(miny+maxy)/2, X=x=>W/2+(x-cx)*scale,Y=y=>H/2-(y-cy)*scale;
 ctx.strokeStyle='#ddd';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,Y(0));ctx.lineTo(W,Y(0));ctx.moveTo(X(0),0);ctx.lineTo(X(0),H);ctx.stroke();
 ctx.strokeStyle='#0969da';ctx.lineWidth=3;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(X(p.x),Y(p.y)):ctx.moveTo(X(p.x),Y(p.y)));ctx.stroke();
 ctx.fillStyle='#1a7f37';ctx.beginPath();ctx.arc(X(0),Y(0),6,0,Math.PI*2);ctx.fill();
 let p=pts[pts.length-1];ctx.fillStyle='#cf222e';ctx.beginPath();ctx.arc(X(p.x),Y(p.y),6,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#222';ctx.font='14px sans-serif';ctx.fillText('起點',X(0)+8,Y(0)-8);ctx.fillText('終點',X(p.x)+8,Y(p.y)-8);
}
async function start(){
 if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
   let p=await DeviceMotionEvent.requestPermission();if(p!=='granted'){alert('需要動作與方向感測器權限');return}
 }
 running=true;lastT=null;window.addEventListener('devicemotion',onMotion);
}
function stop(){running=false;window.removeEventListener('devicemotion',onMotion);rebuildNavigation()}
function reset(){stop();raw=[];rows=[];path=[{x:0,y:0}];basis=z0=y0=x0=null;heading=posX=posY=stepCount=0;$('steps').textContent='0';$('xv').textContent='0.00';$('yv').textContent='0.00';draw()}
function exportCSV(){
 recomputeCentered();let s='t,AO_wx,AP_wy,AQ_wz,AR_thetaX,AS_thetaY,AT_rotZ,AX_filteredZ\n';
 rows.forEach((r,i)=>s += [r.t,r.ao,r.ap,r.aq,r.ar,r.as,r.at,filt4[i]??''].join(',')+'\n');
 let blob=new Blob([s],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='pdr_xy.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);
}
$('start').onclick=start;$('stop').onclick=stop;$('reset').onclick=reset;$('csv').onclick=exportCSV;
['judge','limitSteps','stepThreshold'].forEach(id=>$(id).addEventListener('change',rebuildNavigation));draw();
</script></body></html>
